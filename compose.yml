services:
  sloflix:
    image: lenart12/sloflixfs:latest
    build: .  # used by `docker compose up --build` to build from source instead
    restart: unless-stopped
    environment:
      SLOFLIX_USER: ${SLOFLIX_USER}
      SLOFLIX_PASS: ${SLOFLIX_PASS}
      # SLOFLIX_REFRESH: ${SLOFLIX_REFRESH}
      # SLOFLIX_REVALIDATE: ${SLOFLIX_REVALIDATE}
      # SLOFLIX_PROBE_CACHE: ${SLOFLIX_PROBE_CACHE}
      # SLOFLIX_RATE: ${SLOFLIX_RATE}
      # SLOFLIX_CONCURRENCY: ${SLOFLIX_CONCURRENCY}
      # SLOFLIX_LIMIT_MOVIES: ${SLOFLIX_LIMIT_MOVIES}
      # SLOFLIX_LIMIT_SHOWS: ${SLOFLIX_LIMIT_SHOWS}
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - cache:/cache
      # The FUSE mount lives at $SLOFLIX_DIR/library. The parent dir is what gets bind-mounted, so a mount left
      # dead by a crash can't stop the containers from starting, and sloflix clears it on startup.
      - type: bind
        source: ${SLOFLIX_DIR:-/mnt/sloflix}
        target: /mnt/sloflix
        bind:
          propagation: rshared
          create_host_path: true
    healthcheck:
      test: ["CMD", "test", "-d", "/mnt/sloflix/library/Movies"]
      interval: 30s
      start_period: 10s

  jellyfin:
    image: jellyfin/jellyfin
    restart: unless-stopped
    depends_on:
      sloflix:
        condition: service_healthy
    ports:
      - 8096:8096
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # Libraries: /media/sloflix/library/Movies and /media/sloflix/library/Shows
      - type: bind
        source: ${SLOFLIX_DIR:-/mnt/sloflix}
        target: /media/sloflix
        read_only: true
        bind:
          propagation: rslave

volumes:
  cache:
  jellyfin-config:
  jellyfin-cache:
