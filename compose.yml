# Configure via .env (see .env.example): SLOFLIX_USER, SLOFLIX_PASS, optional SLOFLIX_ARGS and SLOFLIX_DIR.
# The FUSE mount lives at $SLOFLIX_DIR/library. The parent dir is what gets bind-mounted, so a mount left
# dead by a crash can't stop the containers from starting, and sloflix clears it on startup.
services:
  sloflix:
    image: lenart12/sloflix-fuse:latest
    build: .  # used by `docker compose up --build` to build from source instead
    restart: unless-stopped
    # SLOFLIX_ARGS in .env adds flags, e.g. "-limit-movies 10 -limit-shows 2".
    command: sloflix-fuse -mount /mnt/sloflix/library -cache /cache -allow-other ${SLOFLIX_ARGS:-}
    environment:
      SLOFLIX_USER: ${SLOFLIX_USER}
      SLOFLIX_PASS: ${SLOFLIX_PASS}
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - cache:/cache
      # rshared makes the FUSE mount created inside the container visible on the host.
      - type: bind
        source: ${SLOFLIX_DIR:-/mnt/sloflix}
        target: /mnt/sloflix
        bind:
          propagation: rshared
          create_host_path: true
    healthcheck:
      test: ["CMD", "test", "-d", "/mnt/sloflix/library/Movies"]
      interval: 30s
      start_period: 10s

  jellyfin:
    image: jellyfin/jellyfin
    restart: unless-stopped
    depends_on:
      sloflix:
        condition: service_healthy
    ports:
      - 8096:8096
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # Libraries: /media/sloflix/library/Movies and /media/sloflix/library/Shows
      - type: bind
        source: ${SLOFLIX_DIR:-/mnt/sloflix}
        target: /media/sloflix
        read_only: true
        bind:
          propagation: rslave

volumes:
  cache:
  jellyfin-config:
  jellyfin-cache:
